# nginx for the School Management Platform web service.
# Serves the Vite SPA and proxies /api/ to the api container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API (proxied to the api service; path is preserved, e.g. /api/v1/auth/login)
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback (React Router) + long-lived cache for hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
