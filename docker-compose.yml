# School Management Platform — docker compose (production-style, single host)
# Usage:
#   cp .env.example .env        # then fill in real secrets (see below)
#   docker compose up -d --build
#   # open http://localhost  (or your domain, see docs/DEPLOYMENT.md)
#   # demo login: demo@school.pk / Demo1234!   (seeded when SEED_ON_BOOT=true)
#
# First boot: the api container runs `prisma migrate deploy`, seeds the demo
# school if SEED_ON_BOOT=true, then starts. Postgres data persists in the
# `pgdata` volume; uploaded OCR images persist in the `uploads` volume.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-school}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school} -d ${POSTGRES_DB:-school}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-school}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      # 32-byte base64 key — generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # BACK IT UP. If it is lost, every stored parent phone number becomes
      # unreadable forever (see docs/DEPLOYMENT.md).
      PHONE_ENC_KEY: ${PHONE_ENC_KEY:?set PHONE_ENC_KEY in .env}
      SMS_DEVICE_SECRET: ${SMS_DEVICE_SECRET:?set SMS_DEVICE_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OCR_LANGS: ${OCR_LANGS:-eng+urd}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-School Management <no-reply@school.local>}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_KEY: ${SMS_GATEWAY_KEY:-}
      SMS_GATEWAY_FROM: ${SMS_GATEWAY_FROM:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Relative URL: nginx proxies /api/ to the api service, so the whole
        # platform works from one origin. For separate hosting (e.g. Vercel),
        # build with VITE_API_URL=https://api.yourschool.pk/api/v1 instead.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
